<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me ❤️</title>

<style>
*{
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
  overflow:hidden;
}

.container{
  background:#fff;
  padding:20px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:320px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
  font-size:1.3rem;
  color:#ff4d6d;
  margin-bottom:10px;
}

img{
  width:180px;
  max-width:100%;
  height:auto;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:20px;
  position:relative;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

#yesBtn{
  background:#ff4d6d;
  color:#fff;
}

#noBtn{
  background:#ced4da;
  color:#000;
  position:relative;
}

@media(max-width:480px){
  h1{font-size:1.1rem;}
  button{font-size:14px;}
}
</style>
</head>

<body>

<div class="container">
  <h1 id="text">Do you love me? 💕</h1>

  <img id="gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" />

  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<script>
let noClick = 0;

const gif = document.getElementById("gif");
const text = document.getElementById("text");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

/* 🔥 GIF PRELOAD (fast loading) */
const gifs = [
  "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif",
  "https://media.giphy.com/media/l2QDM9Jnim1YVILXa/giphy.gif",
  "https://media.giphy.com/media/9d3LQ6TdV2Flo8ODTU/giphy.gif",
  "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
];
gifs.forEach(src => new Image().src = src);

/* ❌ NO BUTTON LOGIC */
noBtn.addEventListener("click", () => {
  noClick++;

  if(noClick === 1){
    gif.src = gifs[1];
    text.innerText = "Please dobara socho 🥺";
  }
  else if(noClick === 2){
    gif.src = gifs[2];
    text.innerText = "Hey beautiful ❤️ maan jao na\nkitna code likhvaogi 😭";
  }
  else{
    moveNoButton();
  }
});

/* 🏃‍♂️ No button bhaagna */
function moveNoButton(){
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

/* ❤️ YES BUTTON */
yesBtn.addEventListener("click", () => {
  gif.src = gifs[3];
  text.innerText = "I knew it 😍 You love me a lot 💖";
  noBtn.style.display = "none";
  yesBtn.style.display = "none";
});
</script>

</body>
</html>
